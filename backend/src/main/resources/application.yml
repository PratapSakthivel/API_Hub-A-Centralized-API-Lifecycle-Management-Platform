server:
  port: 8080

spring:
  application:
    name: api-hub-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_TTL:86400000} # 24h
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_TTL:604800000} # 7d
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
